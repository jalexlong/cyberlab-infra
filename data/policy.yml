---
vm_offsets:
  teacher_start: 10
  teacher_end: 49
  shared_start: 50
  shared_end: 99
  student_start: 100
  student_end: 199
  overflow_start: 200
  overflow_end: 253

username_policy:
  format: "<display_section>-<codename>-<nn>"
  examples:
    - "cyba3-raven-01"
    - "itsa2-otter-03"
    - "icsa1-maple-02"

password_policy:
  mode: "runtime_generated"
  style: "two_words_two_digits"
  examples:
    - "MapleRiver42"
    - "TigerOcean18"

pool_policy:
  student_pool_format: "stu-<username>"
  teacher_shared_pool_source: "sections.<section>.proxmox.shared_pool"

vm_name_policy:
  format: "<username>-<slot>"
  examples:
    - "cyba3-raven-01-atk"
    - "cyba3-raven-01-win"

vmid_policy:
  formula: "teacher_id * 1000000 + section_code * 1000 + offset"

network_policy:
  formula: "10.<teacher_id>.<section_code>.0/24"
  gateway_host_octet: 1
  default_dhcp_start: 100
  default_dhcp_end: 199

  # Both identifiers below are IP octets in the formula above, so both are
  # bounded by 255. These are enforced by validate_inputs(); they are not
  # documentation.
  #
  # teacher_id_min exists because the low octets are reserved for
  # infrastructure subnets -- prov0 is 10.30.0.0/24 and svc0 is 10.31.0.0/24
  # -- so teachers start at 101, leaving roughly 150 of them.
  #
  # section_code_max also catches the encoded scheme's own ceiling: the
  # <course_index><day><block> composition produces codes above 255 from
  # course_index 3 onward. See Identifiers in docs/roadmap.md.
  teacher_id_min: 101
  teacher_id_max: 255
  section_code_max: 255
