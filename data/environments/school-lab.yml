---
environment:
  name: "school-lab"

  proxmox:
    api_host: "10.64.62.200"
    default_node: "pve1"

    # Where the node's SSH and web UI admit connections from: the wired
    # building LAN and the school wireless. Whole subnets, because every
    # administrator address is DHCP with no reservations. Read by
    # controller-bootstrap-firewall.yml (the management IP set) and
    # host-hardening.yml (sshd and pveproxy), so all three layers admit the
    # same networks. Absent or empty leaves the firewall unscoped.
    management_sources:
      - "10.64.62.0/23"
      - "10.60.0.0/22"

    # Which of the two build types this is. True means the node runs the
    # apt-cacher-ng cache (install-cyberlab.sh --with-package-cache), so
    # template images are built through it and ship pointing at it. Absent or
    # false is the minimalist build: images keep Debian's stock sources and
    # carry no proxy, because a proxy line naming a cache that does not exist
    # breaks apt in every guest. Read by controller-finalize-template-vm.yml.
    package_cache: true

  sections:
    jlong-icsa1:
      proxmox_node: "pve1"
      vnet: "t101c011"
      subnet: "10.101.11.0/24"
      gateway: "10.101.11.1"
      dhcp_start: "10.101.11.100"
      dhcp_end: "10.101.11.199"

    jlong-itsa2:
      proxmox_node: "pve1"
      vnet: "t101c112"
      subnet: "10.101.112.0/24"
      gateway: "10.101.112.1"
      dhcp_start: "10.101.112.100"
      dhcp_end: "10.101.112.199"

    jlong-itsb3:
      proxmox_node: "pve1"
      vnet: "t101c123"
      subnet: "10.101.123.0/24"
      gateway: "10.101.123.1"
      dhcp_start: "10.101.123.100"
      dhcp_end: "10.101.123.199"

    jlong-cyba3:
      proxmox_node: "pve1"
      vnet: "t101c213"
      subnet: "10.101.213.0/24"
      gateway: "10.101.213.1"
      dhcp_start: "10.101.213.100"
      dhcp_end: "10.101.213.199"
