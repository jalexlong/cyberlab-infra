---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      # ansible-lint runs `ansible-playbook --syntax-check`, which cannot
      # resolve module_defaults groups unless the collection is present. Without
      # this step every playbook using community.proxmox reports internal-error
      # and the run is meaningless rather than failing loudly.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint ansible/ data/ .github/

      - name: ansible-lint
        run: ansible-lint --offline ansible/

      - name: ruff
        run: ruff check scripts/ tests/

      # shellcheck comes from the shellcheck-py wheel in requirements-dev.txt,
      # installed above. Pulling it from apt as well would leave the enforced
      # version depending on PATH order rather than on the declared floor.
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  test:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest tests/ -v
