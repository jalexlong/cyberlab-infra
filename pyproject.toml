# Tooling config only. This repository is not a Python package.

[tool.ruff]
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, so a ruff upgrade
# cannot silently change what CI enforces.
#
# F is the important one: F821 (undefined name) is what catches the
# `raiseValueError` class of defect, which `python -m py_compile` does not —
# such a call is syntactically valid and only fails at runtime.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
