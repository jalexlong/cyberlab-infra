---
- name: Promote finalized VM to Proxmox template
  hosts: proxmox_targets
  gather_facts: false

  vars_files:
    - ../vars/templates.yml

  tasks:
    - name: Resolve selected template name
      ansible.builtin.set_fact:
        selected_template_name: "{{ template_name | default('debian13') }}"

    - name: Find matching template definitions
      ansible.builtin.set_fact:
        template_matches: >-
          {{
            templates
            | selectattr('name', 'equalto', selected_template_name)
            | list
            +
            (
              templates
              | selectattr('id', 'defined')
              | selectattr('id', 'equalto', selected_template_name)
              | list
            )
          }}

    - name: Require exactly one matching template definition
      ansible.builtin.assert:
        that:
          - template_matches | length == 1
        fail_msg: >-
          Expected exactly one template matching '{{ selected_template_name }}'
          by id or name, but found {{ template_matches | length }}.
          Available templates:
          {{
            templates
            | map(attribute='name')
            | list
          }}

    - name: Select template definition
      ansible.builtin.set_fact:
        template_def: "{{ template_matches[0] }}"

    - name: Assert template definition exists
      ansible.builtin.assert:
        that:
          - template_def is defined
          - template_def.vmid is defined
        fail_msg: "Template definition for {{ selected_template_name }} was not found."

    - name: Assert template VMID is in template range
      ansible.builtin.assert:
        that:
          - template_def.vmid | int >= 900
          - template_def.vmid | int <= 949
        fail_msg: "Template VMID {{ template_def.vmid }} must be in the 900-949 range."

    - name: Check VM status before promotion
      ansible.builtin.command: "qm status {{ template_def.vmid }}"
      register: qm_status_result
      changed_when: false

    # The authoritative guest-agent check lives at the end of
    # controller-finalize-template-vm.yml, because that is the last point the
    # guest is reachable. Promote cannot inspect a stopped guest, and must not
    # boot one to try: finalize truncates /etc/machine-id and removes the SSH
    # host keys as its last act, so booting here would regenerate them and bake
    # them into every clone of this template.
    #
    # What promote can still catch is the path that skips finalize entirely —
    # promoting a hand-built VM that is still running. That is how the stale
    # template of 2026-05-07 came to exist.
    - name: Check the guest agent when promoting a VM that is still running
      ansible.builtin.command: "qm agent {{ template_def.vmid }} ping"
      register: promote_agent_ping
      changed_when: false
      failed_when: false
      when:
        - template_def.agent_enabled | default(false) | bool
        - "'status: running' in qm_status_result.stdout"

    - name: Require a responding guest agent before promoting a running VM
      ansible.builtin.assert:
        that:
          - promote_agent_ping.rc == 0
        success_msg: "Guest agent responded; VM {{ template_def.vmid }} may be promoted."
        fail_msg: >-
          Template '{{ template_def.name }}' declares agent_enabled, but the
          guest agent on running VM {{ template_def.vmid }} did not respond.
          Refusing to promote: a template whose agent is absent can never pass
          controller-validate-template-clone.yml, and the failure would not
          surface until someone tried to use it. Run the VM through
          controller-finalize-template-vm.yml, which installs and verifies the
          agent, rather than promoting it directly.
      when:
        - template_def.agent_enabled | default(false) | bool
        - "'status: running' in qm_status_result.stdout"

    # Necessary but not sufficient — this proves only that the hypervisor will
    # expose the agent channel, not that anything inside the guest answers on
    # it. It catches a VM created without --agent while the catalog expects one.
    - name: Read VM config to check the agent flag
      ansible.builtin.command: "qm config {{ template_def.vmid }}"
      register: promote_agent_flag_config
      changed_when: false

    - name: Require the VM agent flag to match the template definition
      ansible.builtin.assert:
        that:
          - promote_agent_flag_config.stdout is search('^agent:\s*1', multiline=True)
        fail_msg: >-
          Template '{{ template_def.name }}' declares agent_enabled, but VM
          {{ template_def.vmid }} has no 'agent: 1' in its config, so Proxmox
          will not expose the guest agent channel at all. The validation clone
          would fail regardless of what is installed inside the guest.
      when: template_def.agent_enabled | default(false) | bool

    - name: Request graceful shutdown before promotion when VM is running
      ansible.builtin.command: "qm shutdown {{ template_def.vmid }} --timeout 120"
      register: qm_shutdown_result
      changed_when: true
      failed_when: false
      when:
        - "'status: running' in qm_status_result.stdout"

    - name: Wait for VM to stop before promotion
      ansible.builtin.command: "qm status {{ template_def.vmid }}"
      register: qm_status_wait_result
      changed_when: false
      retries: 30
      delay: 5
      until: "'status: stopped' in qm_status_wait_result.stdout"
      when:
        - "'status: running' in qm_status_result.stdout"

    - name: Refresh VM status before promotion
      ansible.builtin.command: "qm status {{ template_def.vmid }}"
      register: qm_status_final_result
      changed_when: false

    - name: Fail if VM is not stopped
      ansible.builtin.assert:
        that:
          - "'status: stopped' in qm_status_final_result.stdout"
        fail_msg: >-
          VM {{ template_def.vmid }} must be stopped before promotion.
          Current status: {{ qm_status_final_result.stdout }}.
          The promote stage attempted graceful shutdown if the VM was running,
          but it did not reach stopped state.

    # Cyberlab templates ship without a network interface by convention.
    # Attachment is an explicit decision made at clone time, either by the
    # validation stage or by the pod engine pointing the clone at its section
    # VNet, so a clone can never silently inherit whichever bridge the template
    # happened to be built on. Strip before conversion, since a VM's network
    # configuration cannot be edited once it is a template.
    - name: Read VM config before stripping network interfaces
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ template_def.vmid | string }}"
      register: promote_vm_config
      changed_when: false

    - name: Strip network interfaces from the template
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --delete
          - "{{ promote_net_devices | join(',') }}"
      when:
        - "'template: 1' not in promote_vm_config.stdout"
        - promote_net_devices | length > 0
      changed_when: true
      vars:
        promote_net_devices: >-
          {{
            promote_vm_config.stdout_lines
            | select('match', '^net[0-9]+:')
            | map('regex_replace', '^(net[0-9]+):.*$', '\1')
            | list
          }}

    - name: Check whether VM is already a template
      ansible.builtin.shell: >
        qm config {{ template_def.vmid }} | grep -q '^template: 1$'
      args:
        executable: /bin/bash
      register: template_flag_check
      failed_when: false
      changed_when: false

    - name: Convert VM to template if needed
      ansible.builtin.command:
        argv:
          - qm
          - template
          - "{{ template_def.vmid | string }}"
      when: template_flag_check.rc != 0
      register: promote_result
      changed_when: promote_result.rc == 0

    - name: Show promoted template config
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ template_def.vmid | string }}"
      register: final_template_config
      changed_when: false

    - name: Print promotion summary
      ansible.builtin.debug:
        msg:
          - "template_name={{ template_def.name }}"
          - "vmid={{ template_def.vmid }}"
          - "promoted=true"
          - "template_flag=true"
          - "{{ final_template_config.stdout }}"
