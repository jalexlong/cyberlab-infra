---
# Bootstrap Proxmox SDN for Cyberlab.
#
# Knows about two classes of network, and by default builds only the first:
#
#   1. Infrastructure networks, declared in ansible/inventory.yml under
#      proxmox_sdn. Currently just prov0, the provisioning network used to
#      build templates. This one keeps SNAT so template builds can reach
#      package repositories. Always built.
#
#   2. Per-section classroom networks, derived from
#      data/environments/<env>.yml. These deliberately have SNAT disabled so
#      lab traffic cannot reach the school network or the internet, and
#      isolate-ports disabled so students within a section can reach each
#      other's machines. NOT built unless asked for — see
#      cyberlab_sdn_build_sections below.
#
# The classroom topology is Phase 5 work and exists on no host today. The
# provisioning network is different: the template factory cannot function
# without it, because every template in ansible/vars/templates.yml is built and
# validated on prov0 and addressed from its subnet.
#
# Usage:
#   ansible-playbook -i inventory.yml playbooks/controller-bootstrap-sdn.yml
#   ansible-playbook -i inventory.yml playbooks/controller-bootstrap-sdn.yml -e cyberlab_env=demo-lab
#   ansible-playbook -i inventory.yml playbooks/controller-bootstrap-sdn.yml -e cyberlab_sdn_build_sections=true
#
# This playbook is additive. It never deletes VNets or subnets it does not
# recognise, so hand-built networks are left untouched. That also means
# switching cyberlab_sdn_build_sections back to false does not remove
# classroom VNets an earlier run created; tear those down deliberately.

- name: Bootstrap Proxmox SDN from controller
  hosts: proxmox_targets
  gather_facts: false

  vars:
    cyberlab_env: school-lab

    # Whether to build the per-section classroom VNets from the environment
    # file. Off by default: those networks are Phase 5 work, exist on no host,
    # and a plain run of this playbook should not resurrect a topology nobody
    # asked for. Infrastructure networks are always built.
    cyberlab_sdn_build_sections: false

    repo_root: "{{ playbook_dir }}/../.."
    environment_file: "{{ repo_root }}/data/environments/{{ cyberlab_env }}.yml"
    sections_file: "{{ repo_root }}/data/sections.yml"

    environment_data: "{{ lookup('file', environment_file) | from_yaml }}"
    sections_data: "{{ lookup('file', sections_file) | from_yaml }}"
    env_sections: "{{ environment_data.environment.sections | default({}) }}"

    zone_name: "{{ proxmox_sdn.zone.name }}"
    zone_type: "{{ proxmox_sdn.zone.type }}"
    zone_dhcp: "{{ proxmox_sdn.zone.dhcp }}"
    zone_ipam: "{{ proxmox_sdn.zone.ipam }}"
    zone_mtu: "{{ proxmox_sdn.zone.mtu }}"

    # Classroom networks. isolate_ports is false so students in a section can
    # interact.
    #
    # snat is false, which prevents address translation -- it does NOT prevent
    # reachability, and this comment used to claim it meant "no egress at all".
    # The zone is type simple, so the host holds a gateway address on every
    # VNet subnet, and this playbook itself asserts net.ipv4.ip_forward=1 for
    # prov0's SNAT. A forwarding host with an address on every lab subnet and
    # no firewall rules is a router between all of them, so section networks
    # can very likely reach each other, prov0, and the Proxmox management
    # address. Isolation has to come from the Proxmox firewall, not from this
    # flag. See docs/network-isolation.md and Phase 5 in docs/roadmap.md.
    # Suspected by inspection, not yet confirmed on hardware.
    #
    # Proxmox restricts VNet aliases to letters, digits, hyphen, underscore,
    # period and space, so section aliases are sanitised rather than passed
    # through. Course names such as "IT & Security - A2" are otherwise rejected
    # with an unhelpful "value does not match the regex pattern" error partway
    # through the loop, leaving some VNets created and others missing.
    section_vnets: >-
      {%- set out = [] -%}
      {%- for key, sec in (env_sections | dictsort) -%}
      {%-   set _ = out.append({
              'name': sec.vnet,
              'alias': (
                (sections_data.sections[key].alias | default(key))
                | regex_replace('[^A-Za-z0-9_. -]', ' ')
                | regex_replace(' +', ' ')
                | trim
              ),
              'isolate_ports': false
            }) -%}
      {%- endfor -%}
      {{ out }}

    section_subnets: >-
      {%- set out = [] -%}
      {%- for key, sec in (env_sections | dictsort) -%}
      {%-   set _ = out.append({
              'name': sec.vnet,
              'subnet': sec.subnet,
              'gateway': sec.gateway,
              'snat': false,
              'dhcp_start': sec.dhcp_start,
              'dhcp_end': sec.dhcp_end
            }) -%}
      {%- endfor -%}
      {{ out }}

    # Everything declared across both sources, whether or not this run builds
    # it. The name checks below validate against this, so a section VNet with
    # an over-long or duplicate name is still caught on an infrastructure-only
    # run rather than lying in wait until sections are switched on.
    declared_vnets: "{{ (proxmox_sdn.vnets | default([])) + section_vnets }}"

    # What this run actually creates.
    all_vnets: >-
      {{
        (proxmox_sdn.vnets | default([]))
        + (section_vnets if (cyberlab_sdn_build_sections | bool) else [])
      }}
    all_subnets: >-
      {{
        (proxmox_sdn.subnets | default([]))
        + (section_subnets if (cyberlab_sdn_build_sections | bool) else [])
      }}

  tasks:
    - name: Require every environment section to exist in sections.yml
      ansible.builtin.assert:
        that:
          - env_sections.keys() | difference(sections_data.sections.keys() | list) | length == 0
        fail_msg: >-
          {{ environment_file }} references sections that are absent from
          {{ sections_file }}:
          {{ env_sections.keys() | difference(sections_data.sections.keys() | list) | join(', ') }}

    # Proxmox rejects VNet names longer than 8 characters. This is why the data
    # model uses compact identifiers such as t101c213 rather than the full
    # section key.
    - name: Require VNet names to fit the Proxmox 8 character limit
      ansible.builtin.assert:
        that:
          - oversized_vnets | length == 0
        fail_msg: >-
          These VNet names exceed the Proxmox 8 character limit:
          {{ oversized_vnets | join(', ') }}
      vars:
        oversized_vnets: >-
          {{ declared_vnets | map(attribute='name') | select('match', '^.{9,}$') | list }}

    - name: Require VNet names to be unique
      ansible.builtin.assert:
        that:
          - (declared_vnets | map(attribute='name') | list | length)
            == (declared_vnets | map(attribute='name') | unique | list | length)
        fail_msg: >-
          Duplicate VNet names detected across infrastructure and section
          networks: {{ declared_vnets | map(attribute='name') | list | sort | join(', ') }}

    - name: Show the SDN plan
      ansible.builtin.debug:
        msg:
          - "environment: {{ cyberlab_env }}"
          - "zone: {{ zone_name }}"
          - "infrastructure vnets: {{ proxmox_sdn.vnets | default([]) | map(attribute='name') | join(', ') }}"
          - >-
            {{
              'section vnets: ' ~ (section_vnets | map(attribute='name') | join(', '))
              ~ ' (snat=false, isolate-ports=false)'
              if (cyberlab_sdn_build_sections | bool)
              else 'section vnets: NOT being built. '
                   ~ (section_vnets | length) ~ ' are declared in '
                   ~ cyberlab_env ~ ' and will be skipped. '
                   ~ 'Pass -e cyberlab_sdn_build_sections=true to build them.'
            }}
          - "this run will create: {{ all_vnets | map(attribute='name') | join(', ') }}"

    - name: Check whether SDN zone exists
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/sdn/zones/{{ zone_name }}"
      register: sdn_zone_check
      failed_when: false
      changed_when: false

    - name: Create SDN zone
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/sdn/zones
          - --zone
          - "{{ zone_name }}"
          - --type
          - "{{ zone_type }}"
          - --dhcp
          - "{{ zone_dhcp }}"
          - --ipam
          - "{{ zone_ipam }}"
          - --mtu
          - "{{ zone_mtu | string }}"
      when: sdn_zone_check.rc != 0

    - name: Check whether VNET exists
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/sdn/vnets/{{ item.name }}"
      loop: "{{ all_vnets }}"
      loop_control:
        label: "{{ item.name }}"
      register: vnet_checks
      failed_when: false
      changed_when: false

    - name: Create VNETs
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/sdn/vnets
          - --vnet
          - "{{ item.item.name }}"
          - --zone
          - "{{ zone_name }}"
          - --alias
          - "{{ item.item.alias }}"
          - --isolate-ports
          - "{{ 1 if item.item.isolate_ports else 0 }}"
      loop: "{{ vnet_checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc != 0

    - name: Ensure subnets exist
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - "/cluster/sdn/vnets/{{ item.name }}/subnets"
          - --subnet
          - "{{ item.subnet }}"
          - --type
          - subnet
          - --gateway
          - "{{ item.gateway }}"
          - --snat
          - "{{ 1 if item.snat else 0 }}"
          - --dhcp-range
          - "start-address={{ item.dhcp_start }},end-address={{ item.dhcp_end }}"
      loop: "{{ all_subnets }}"
      loop_control:
        label: "{{ item.name }} {{ item.subnet }} snat={{ item.snat }}"
      register: subnet_create_results
      failed_when:
        - subnet_create_results.rc != 0
        - "'already defined' not in (subnet_create_results.stderr | default(''))"
      changed_when: subnet_create_results.rc == 0

    # Subnet creation is skipped when the subnet already exists, so a setting
    # changed in the data model would otherwise never reach an existing
    # deployment. prov0 on the school-lab host is exactly this case: it was
    # created before a DHCP range was declared and has had none since, which
    # silently prevents any guest on the provisioning network from obtaining a
    # lease and makes template validation fail for reasons unrelated to the
    # image. Reconcile settings explicitly rather than assuming creation
    # covered them.
    - name: Reconcile settings on existing subnets
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - "/cluster/sdn/vnets/{{ item.name }}/subnets/{{ zone_name }}-{{ item.subnet | replace('/', '-') }}"
          - --gateway
          - "{{ item.gateway }}"
          - --snat
          - "{{ 1 if item.snat else 0 }}"
          - --dhcp-range
          - "start-address={{ item.dhcp_start }},end-address={{ item.dhcp_end }}"
      loop: "{{ all_subnets }}"
      loop_control:
        label: "{{ item.name }} {{ item.subnet }} snat={{ item.snat }} dhcp={{ item.dhcp_start }}-{{ item.dhcp_end }}"
      register: subnet_reconcile_results
      changed_when: subnet_reconcile_results.rc == 0

    - name: Apply SDN configuration
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - /cluster/sdn
      register: sdn_apply
      changed_when: sdn_apply.rc == 0

    - name: Enable IPv4 forwarding persistently for Cyberlab SDN SNAT
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cyberlab-forwarding.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1

    - name: Apply IPv4 forwarding immediately
      ansible.builtin.command:
        argv:
          - sysctl
          - -w
          - net.ipv4.ip_forward=1
      changed_when: false

    - name: Read IPv4 forwarding state
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - net.ipv4.ip_forward
      register: ipv4_forward_result
      changed_when: false

    - name: Require IPv4 forwarding for Cyberlab SDN SNAT
      ansible.builtin.assert:
        that:
          - ipv4_forward_result.stdout | trim == "1"
        fail_msg: "Cyberlab SDN SNAT requires net.ipv4.ip_forward=1."

    - name: Reload networking
      ansible.builtin.command:
        argv:
          - ifreload
          - -a
      register: ifreload_result
      changed_when: ifreload_result.rc == 0

    - name: Verify every expected VNet interface exists on the host
      ansible.builtin.command:
        argv:
          - ip
          - -br
          - link
          - show
          - "{{ item.name }}"
      loop: "{{ all_vnets }}"
      loop_control:
        label: "{{ item.name }}"
      register: vnet_iface_checks
      failed_when: false
      changed_when: false

    - name: Require every expected VNet interface to be present
      ansible.builtin.assert:
        that:
          - missing_vnet_ifaces | length == 0
        fail_msg: >-
          SDN objects were created but these VNet interfaces are absent from the
          host: {{ missing_vnet_ifaces | join(', ') }}.
          Creating SDN objects is not sufficient; the interfaces must exist
          before templates or pods are blamed for missing connectivity.
      vars:
        missing_vnet_ifaces: >-
          {{
            vnet_iface_checks.results
            | rejectattr('rc', 'equalto', 0)
            | map(attribute='item.name')
            | list
          }}

    # docs/platform-pipeline.md requires proving the dnsmasq-backed service is
    # actually serving, not merely that SDN objects were written. The zone
    # instance fails to start if anything else already holds :53 on the host,
    # most commonly Debian's stock dnsmasq.service, and without it no guest on
    # any VNet can obtain a lease.
    - name: Check the SDN zone DHCP service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "dnsmasq@{{ zone_name }}.service"
      register: zone_dnsmasq_state
      changed_when: false
      failed_when: false

    - name: Require the SDN zone DHCP service to be running
      ansible.builtin.assert:
        that:
          - zone_dnsmasq_state.stdout | trim == 'active'
        fail_msg: >-
          dnsmasq@{{ zone_name }}.service is '{{ zone_dnsmasq_state.stdout | trim }}',
          so no guest on any VNet in this zone can obtain a DHCP lease.
          Check whether Debian's stock dnsmasq.service is running and bound to
          0.0.0.0:53, which prevents the zone instance from binding its VNet
          addresses:
            systemctl disable --now dnsmasq.service
            systemctl restart dnsmasq@{{ zone_name }}.service
        success_msg: "dnsmasq@{{ zone_name }}.service is active and serving the zone."

    - name: Show resulting SDN zones
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - /cluster/sdn/zones
          - --output-format
          - yaml
      register: zones_out
      changed_when: false

    - name: Show resulting SDN vnets
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - /cluster/sdn/vnets
          - --output-format
          - yaml
      register: vnets_out
      changed_when: false

    - name: Show resulting subnets for each VNet
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/sdn/vnets/{{ item.name }}/subnets"
          - --output-format
          - yaml
      loop: "{{ all_vnets }}"
      loop_control:
        label: "{{ item.name }}"
      register: subnets_out
      changed_when: false
      failed_when: false

    - name: Print SDN summary
      ansible.builtin.debug:
        msg:
          - "{{ zones_out.stdout }}"
          - "{{ vnets_out.stdout }}"
          - "{{ subnets_out.results | map(attribute='stdout') | list }}"
