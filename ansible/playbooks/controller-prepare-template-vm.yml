---
- name: Prepare template VM on Proxmox host
  hosts: proxmox_targets
  gather_facts: false

  vars_files:
    - ../vars/templates.yml

  vars:
    image_cache_dir: /var/lib/vz/template/qcow2
    controller_pubkey_path_in_ct: /root/.ssh/id_ed25519_controller.pub
    # Only consulted for entries whose ssh_pubkey_source is controller_ct.
    controller_ctid: 800

  tasks:
    - name: Resolve selected template name
      ansible.builtin.set_fact:
        selected_template_name: "{{ template_name | default('debian13') }}"

    - name: Find matching template definitions
      ansible.builtin.set_fact:
        template_matches: >-
          {{
            templates
            | selectattr('name', 'equalto', selected_template_name)
            | list
            +
            (
              templates
              | selectattr('id', 'defined')
              | selectattr('id', 'equalto', selected_template_name)
              | list
            )
          }}

    - name: Require exactly one matching template definition
      ansible.builtin.assert:
        that:
          - template_matches | length == 1
        fail_msg: >-
          Expected exactly one template matching '{{ selected_template_name }}'
          by id or name, but found {{ template_matches | length }}.
          Available templates:
          {{
            templates
            | map(attribute='name')
            | list
          }}

    - name: Select template definition
      ansible.builtin.set_fact:
        template_def: "{{ template_matches[0] }}"

    - name: Assert template definition exists
      ansible.builtin.assert:
        that:
          - template_def is defined
          - template_def.name is defined
          - template_def.vmid is defined
          - template_def.build_method is defined
          - template_def.target_node is defined
          - template_def.disk_storage is defined
          - template_def.cloudinit_storage is defined
          - template_def.bridge is defined
        fail_msg: "Template definition for {{ selected_template_name }} is missing required keys."

    # `target_node` was in the catalog from the start and read by nothing. That
    # was invisible while `proxmox_targets` held exactly one host; adding pve2
    # made it load-bearing. Without this gate, building `debian13` would create
    # VMID 900 on pve2 as well as pve1 -- silently, and on a node that has no
    # prov0 for it to boot onto.
    - name: End play on nodes this template does not target
      ansible.builtin.meta: end_host
      when: template_def.target_node != inventory_hostname

    - name: Assert template VMID is in template range
      ansible.builtin.assert:
        that:
          - template_def.vmid | int >= 900
          - template_def.vmid | int <= 949
        fail_msg: "Template VMID {{ template_def.vmid }} must be in the 900-949 range."

    - name: Assert build method is supported
      ansible.builtin.assert:
        that:
          - template_def.build_method in ['cloud_image', 'qcow_import', 'iso_install', 'legacy_appliance']
        fail_msg: "Unsupported build_method {{ template_def.build_method }}."

    - name: Ensure image cache directory exists
      ansible.builtin.file:
        path: "{{ image_cache_dir }}"
        state: directory
        mode: "0755"

    - name: Assert current template uses cloud image flow
      ansible.builtin.assert:
        that:
          - template_def.build_method == 'cloud_image'
          - template_def.image_url | length > 0
          - template_def.image_filename | length > 0
        fail_msg: "This prepare playbook currently supports cloud_image templates only."

    - name: Check whether cloud image is already cached
      ansible.builtin.stat:
        path: "{{ image_cache_dir }}/{{ template_def.image_filename }}"
      register: cached_image_stat

    - name: Show cached image status
      ansible.builtin.debug:
        msg:
          - "image_path={{ image_cache_dir }}/{{ template_def.image_filename }}"
          - "cached={{ cached_image_stat.stat.exists }}"

    - name: Download cloud image if missing
      ansible.builtin.get_url:
        url: "{{ template_def.image_url }}"
        dest: "{{ image_cache_dir }}/{{ template_def.image_filename }}"
        mode: "0644"
        force: false
        timeout: 120
      when: not cached_image_stat.stat.exists

    - name: Check whether VM already exists
      ansible.builtin.command:
        argv:
          - qm
          - status
          - "{{ template_def.vmid | string }}"
      register: qm_status_result
      failed_when: false
      changed_when: false

    - name: Create VM shell if missing
      ansible.builtin.command:
        argv:
          - qm
          - create
          - "{{ template_def.vmid | string }}"
          - --name
          - "{{ template_def.name }}"
          - --memory
          - "{{ template_def.memory | string }}"
          - --cores
          - "{{ template_def.cores | string }}"
          - --sockets
          - "{{ template_def.sockets | string }}"
          - --cpu
          - "{{ template_def.cpu }}"
          - --machine
          - "{{ template_def.machine }}"
          - --bios
          - "{{ template_def.bios }}"
          - --scsihw
          - "{{ template_def.scsihw }}"
          - --net0
          - "{{ template_def.net_model }},bridge={{ template_def.bridge }}"
          - --agent
          - "{{ 1 if template_def.agent_enabled else 0 }}"
          - --ostype
          - l26
      when: qm_status_result.rc != 0

    - name: Assert VM is not already a template
      ansible.builtin.shell: >
        qm config {{ template_def.vmid }} | grep -q '^template: 1$'
      args:
        executable: /bin/bash
      register: template_flag_check
      failed_when: false
      changed_when: false

    - name: Fail if VM is already a template
      ansible.builtin.assert:
        that:
          - template_flag_check.rc != 0
        fail_msg: "VM {{ template_def.vmid }} is already a template. Do not run prepare on a promoted template."

    - name: Check whether imported disk is already attached
      ansible.builtin.shell: >
        qm config {{ template_def.vmid }} | grep -q '^scsi0:'
      args:
        executable: /bin/bash
      register: disk_present_result
      failed_when: false
      changed_when: false

    - name: Import qcow2 disk if missing
      ansible.builtin.command:
        argv:
          - qm
          - importdisk
          - "{{ template_def.vmid | string }}"
          - "{{ image_cache_dir }}/{{ template_def.image_filename }}"
          - "{{ template_def.disk_storage }}"
      when: disk_present_result.rc != 0

    - name: Attach imported disk to scsi0 if missing
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --scsi0
          - "{{ template_def.disk_storage }}:vm-{{ template_def.vmid }}-disk-0,discard=on,ssd=1"
      when: disk_present_result.rc != 0

    # Where the key comes from is a property of the NODE, not of the image, but
    # it is expressed per catalog entry because that is the only place a node
    # appears. pve1 keeps its key inside controller CT 800; pve2 has no such
    # container, so the key has to be a file on the node itself.
    - name: Read template SSH public key from the controller CT
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ controller_ctid | string }}"
          - --
          - cat
          - "{{ controller_pubkey_path_in_ct }}"
      register: controller_template_pubkey
      changed_when: false
      when: (template_def.ssh_pubkey_source | default('controller_ct')) == 'controller_ct'

    - name: Read template SSH public key from a file on the node
      ansible.builtin.slurp:
        src: "{{ template_def.ssh_pubkey_path }}"
      register: host_template_pubkey
      failed_when: false
      when: (template_def.ssh_pubkey_source | default('controller_ct')) == 'host_file'

    - name: Resolve the template SSH public key
      ansible.builtin.set_fact:
        template_pubkey_content: >-
          {{
            controller_template_pubkey.stdout
            if (template_def.ssh_pubkey_source | default('controller_ct')) == 'controller_ct'
            else (host_template_pubkey.content | default('') | b64decode)
          }}

    # Without this the failure surfaces much later and in the wrong place: the
    # VM builds, cloud-init installs an empty authorized_keys, and the finalize
    # stage times out waiting for an SSH login that can never succeed.
    - name: Require a usable template SSH public key
      ansible.builtin.assert:
        that:
          - template_pubkey_content | trim | length > 0
          - "'ssh-' in template_pubkey_content"
        fail_msg: >-
          No usable SSH public key for template '{{ template_def.name }}' on
          {{ inventory_hostname }}.
          {{
            "Expected to read it from controller CT " ~ controller_ctid ~ " at "
            ~ controller_pubkey_path_in_ct
            if (template_def.ssh_pubkey_source | default('controller_ct')) == 'controller_ct'
            else "Expected a public key file at " ~ (template_def.ssh_pubkey_path | default('<unset>'))
                 ~ " on " ~ inventory_hostname ~ ". Create it there, or point"
                 ~ " ssh_pubkey_path at a key that exists."
          }}

    - name: Write temporary controller SSH public key file
      ansible.builtin.copy:
        dest: /tmp/controller-template-key.pub
        mode: "0644"
        content: "{{ template_pubkey_content }}"

    - name: Configure template VM defaults
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --boot
          - "{{ template_def.boot }}"
          - --bootdisk
          - scsi0
          - --serial0
          - "{{ 'socket' if template_def.serial_socket else '' }}"
          - --vga
          - "{{ template_def.vga }}"
          - --ciuser
          - "{{ template_def.ci_user }}"
          - --ciupgrade
          - "{{ 1 if template_def.ci_upgrade else 0 }}"
          - --ipconfig0
          - "{{ template_def.bootstrap_ipconfig0 | default(template_def.ipconfig0) }}"
          - --sshkeys
          - /tmp/controller-template-key.pub
          - --description
          - "{{ template_def.description }}"
          - --tags
          - "{{ template_def.tags }}"
      changed_when: true

    - name: Attach cloud-init disk
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --ide2
          - "{{ template_def.cloudinit_storage }}:cloudinit"
      register: cloudinit_attach_result
      failed_when: false
      changed_when: cloudinit_attach_result.rc == 0

    - name: Set cloud-init nameserver when defined
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --nameserver
          - "{{ template_def.nameserver }}"
      register: set_template_nameserver
      changed_when: set_template_nameserver.rc == 0
      when:
        - template_def.nameserver is defined
        - template_def.nameserver | length > 0

    - name: Set cloud-init search domain when defined
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ template_def.vmid | string }}"
          - --searchdomain
          - "{{ template_def.searchdomain }}"
      register: set_template_searchdomain
      changed_when: set_template_searchdomain.rc == 0
      when:
        - template_def.searchdomain is defined
        - template_def.searchdomain | length > 0

    - name: Remove temporary controller SSH public key file
      ansible.builtin.file:
        path: /tmp/controller-template-key.pub
        state: absent

    - name: Show prepared VM config
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ template_def.vmid | string }}"
      register: prepared_vm_config
      changed_when: false

    - name: Print prepare summary
      ansible.builtin.debug:
        msg:
          - "template_name={{ template_def.name }}"
          - "vmid={{ template_def.vmid }}"
          - "build_method={{ template_def.build_method }}"
          - "prepared=true"
          - "template_flag=false"
          - "next_step=controller-finalize-template-vm.yml"
          - "{{ prepared_vm_config.stdout }}"
