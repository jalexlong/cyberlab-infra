---
- name: Validate controller access to Proxmox API
  hosts: controller
  gather_facts: false

  vars:
    proxmox_api_env_file: /root/cyberlab-infra/private/secrets/proxmox-api.env
    proxmox_version_endpoint: "/version"

  tasks:
    - name: Assert Proxmox API env file exists
      ansible.builtin.stat:
        path: "{{ proxmox_api_env_file }}"
      register: proxmox_api_env_file_stat

    - name: Fail if Proxmox API env file is missing
      ansible.builtin.assert:
        that:
          - proxmox_api_env_file_stat.stat.exists
        fail_msg: "Missing Proxmox API env file at {{ proxmox_api_env_file }}"

    - name: Read Proxmox API env file
      ansible.builtin.slurp:
        path: "{{ proxmox_api_env_file }}"
      register: proxmox_api_env_raw

    - name: Parse Proxmox API env file
      ansible.builtin.set_fact:
        proxmox_api_env_lines: >-
          {{
            (proxmox_api_env_raw.content | b64decode).splitlines()
            | map('trim')
            | reject('equalto', '')
            | reject('match', '^#')
            | select('match', '^[A-Za-z_][A-Za-z0-9_]*=')
            | list
          }}

    - name: Assert parsed env lines were found
      ansible.builtin.assert:
        that:
          - proxmox_api_env_lines | length > 0
        fail_msg: "No valid KEY=value lines found in {{ proxmox_api_env_file }}"

    - name: Build Proxmox API env map
      ansible.builtin.set_fact:
        proxmox_api_env: "{{ proxmox_api_env | default({}) | combine({(item | regex_replace('=.*$', '')): (item | regex_replace('^[^=]*=', ''))}) }}"
      loop: "{{ proxmox_api_env_lines }}"
      when: "'=' in item"
      no_log: true

    - name: Assert required Proxmox API variables are present
      ansible.builtin.assert:
        that:
          - "'PROXMOX_API_URL' in proxmox_api_env"
          - "'PROXMOX_API_TOKEN_ID' in proxmox_api_env"
          - "'PROXMOX_API_TOKEN_SECRET' in proxmox_api_env"
        fail_msg: "Missing one or more required variables in {{ proxmox_api_env_file }}"
      no_log: true

    - name: Query Proxmox version endpoint
      ansible.builtin.uri:
        url: "{{ proxmox_api_env.PROXMOX_API_URL }}{{ proxmox_version_endpoint }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_env.PROXMOX_API_TOKEN_ID }}={{ proxmox_api_env.PROXMOX_API_TOKEN_SECRET }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: proxmox_version_response
      no_log: true

    # /version is readable by any authenticated user, so reaching it proves only
    # that the token exists. Query the token's own effective permissions to
    # prove it can actually do privileged work; without this an unprivileged
    # token reports a passing validation and then fails at first real use.
    - name: Query effective permissions for the automation token
      ansible.builtin.uri:
        url: "{{ proxmox_api_env.PROXMOX_API_URL }}/access/permissions"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_env.PROXMOX_API_TOKEN_ID }}={{ proxmox_api_env.PROXMOX_API_TOKEN_SECRET }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: proxmox_permissions_response
      no_log: true

    - name: Collect privileges granted at the root path
      ansible.builtin.set_fact:
        proxmox_root_privs: >-
          {{
            (proxmox_permissions_response.json.data['/'] | default({}))
            | dict2items
            | selectattr('value', 'equalto', 1)
            | map(attribute='key')
            | list
          }}

    - name: Require the automation token holds privileges needed by the platform
      ansible.builtin.assert:
        that:
          - required_proxmox_privs | difference(proxmox_root_privs) | length == 0
        fail_msg: >-
          The automation token authenticates but is missing required privileges
          at '/': {{ required_proxmox_privs | difference(proxmox_root_privs) | join(', ') }}.
          Re-run host-bootstrap.yml to reconcile the automation role and ACL.
        success_msg: >-
          Automation token holds all {{ required_proxmox_privs | length }} required
          privileges at '/'.
      vars:
        required_proxmox_privs:
          - SDN.Allocate
          - VM.Allocate
          - VM.Clone
          - VM.Config.Network
          - Datastore.AllocateSpace
          - Pool.Allocate
          - Sys.Modify

    - name: Show Proxmox API validation result
      ansible.builtin.debug:
        msg:
          - "Connected to Proxmox API successfully."
          - "Version: {{ proxmox_version_response.json.data.version }}"
          - "Release: {{ proxmox_version_response.json.data.release }}"
          - "Repo ID: {{ proxmox_version_response.json.data.repoid }}"
          - "Privileges at '/': {{ proxmox_root_privs | length }} granted"
