[defaults]
# Picked up when ansible-playbook runs from this directory, which is how the
# controller invokes it (see README).
inventory = inventory.yml

# Silence the interpreter-discovery warning without pinning a path that would
# differ between the controller LXC and a bench workstation.
interpreter_python = auto_silent

# Readable multi-line output; these playbooks assert with long fail_msg values
# that are unreadable on a single line.
stdout_callback = yaml

# Retry files are noise for playbooks that are re-run wholesale.
retry_files_enabled = False

# host_key_checking is deliberately left at its default (enabled). Bootstrap
# establishes SSH trust from the controller to the host explicitly, so
# disabling it here would remove a check the platform already satisfies.

[ssh_connection]
pipelining = True
