[defaults]
# Picked up when ansible-playbook runs from this directory, which is how the
# controller invokes it (see README).
inventory = inventory.yml

# Silence the interpreter-discovery warning without pinning a path that would
# differ between the controller LXC and a bench workstation.
interpreter_python = auto_silent

# Readable multi-line output; these playbooks assert with long fail_msg values
# that are unreadable on a single line.
#
# `stdout_callback = yaml` is the obvious spelling and is a trap: ansible-core
# redirects the bare name to `community.general.yaml`, which that collection
# removed in 12.0.0, so ansible-playbook fails to start rather than falling back
# to plain output. The controller LXC pins community.general 11.2.1 and never
# saw it; a bench workstation on a current collection cannot run any playbook in
# this repository. `result_format` is the built-in equivalent from core 2.13 on
# (controller is 2.19.4), needs no collection, and cannot be removed from under
# us the same way.
#
# Note the ini key is `callback_result_format`, not `result_format`: the option
# the documentation names `result_format` is spelled differently in a config
# file, and the wrong spelling is accepted silently and ignored, leaving JSON
# output and no error to explain it.
stdout_callback = default
callback_result_format = yaml

# Retry files are noise for playbooks that are re-run wholesale.
retry_files_enabled = False

# host_key_checking is deliberately left at its default (enabled). Bootstrap
# establishes SSH trust from the controller to the host explicitly, so
# disabling it here would remove a check the platform already satisfies.

[ssh_connection]
pipelining = True
